<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Mi Amor</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <style>
        body {
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }
        .container {
            background: rgba(255, 255, 255, 0.2);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            animation: fadeIn 2s ease-in-out;
        }
        h1 {
            animation: bounce 2s infinite alternate;
        }
        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-10px); }
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .heart {
            font-size: 50px;
            display: inline-block;
            transition: transform 0.3s ease-in-out;
        }
        .heart:hover {
            transform: scale(1.5) rotate(20deg);
        }
        button {
            background: #ff4e50;
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }
        button:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }
        .oculto {
            display: none;
            font-size: 20px;
            margin-top: 15px;
            animation: fadeIn 2s ease-in-out;
        }
        .sparkle {
            position: absolute;
            width: 10px;
            height: 10px;
            background: white;
            opacity: 0.8;
            border-radius: 50%;
            animation: sparkle-animation 1s linear infinite;
        }
        @keyframes sparkle-animation {
            0% { transform: scale(0.5) translateY(0); opacity: 1; }
            100% { transform: scale(1.5) translateY(-50px); opacity: 0; }
        }
    </style>
</head>
<body>
    <audio id="soundEffect" src="https://www.myinstants.com/media/sounds/magic-chime-02.mp3"></audio>
    <div class="container">
        <h1>Feliz San Valentín, Mi Amor ❤️</h1>
        <p>Eres la persona más especial en mi vida.</p>
        <button onclick="mostrarMensaje()">Haz clic aquí</button>
        <div id="mensaje" class="oculto">Te amo mucho mucho chichi💖</div>
        <div class="heart">❤️</div>
    </div>
    <div class="corazones"></div>
    <script>
        function mostrarMensaje() {
            document.getElementById("mensaje").style.display = "block";
            document.getElementById("soundEffect").play();
            for (let i = 0; i < 20; i++) {
                let sparkle = document.createElement("div");
                sparkle.classList.add("sparkle");
                document.body.appendChild(sparkle);
                sparkle.style.left = Math.random() * window.innerWidth + "px";
                sparkle.style.top = Math.random() * window.innerHeight + "px";
                setTimeout(() => sparkle.remove(), 4000);
            }
        }
    </script>
</body>
</html>
